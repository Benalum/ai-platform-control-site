<svg width="1100" height="680" viewBox="0 0 1100 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="680" rx="28" fill="#07111F"/>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132B4D"/>
      <stop offset="1" stop-color="#0B1A31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72F7C3"/>
      <stop offset="1" stop-color="#70A7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#72F7C3"/>
    </marker>
  </defs>

  <text x="52" y="68" fill="white" font-size="32" font-family="Arial" font-weight="800">AI Platform Control Architecture</text>
  <text x="52" y="103" fill="#A9B8D0" font-size="18" font-family="Arial">Public access stays controlled; raw admin tools stay private.</text>

  <g filter="url(#shadow)">
    <rect x="58" y="160" width="178" height="90" rx="18" fill="url(#box)" stroke="#25476E"/>
    <text x="147" y="195" fill="white" font-size="18" font-family="Arial" text-anchor="middle" font-weight="800">Users</text>
    <text x="147" y="222" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Browser / mobile</text>

    <rect x="310" y="160" width="178" height="90" rx="18" fill="url(#box)" stroke="#25476E"/>
    <text x="399" y="195" fill="white" font-size="18" font-family="Arial" text-anchor="middle" font-weight="800">Cloudflare</text>
    <text x="399" y="222" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">DNS, Pages, Access</text>

    <rect x="562" y="160" width="178" height="90" rx="18" fill="url(#box)" stroke="#25476E"/>
    <text x="651" y="195" fill="white" font-size="18" font-family="Arial" text-anchor="middle" font-weight="800">Dashboard</text>
    <text x="651" y="222" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Job submission UI</text>

    <rect x="814" y="160" width="228" height="90" rx="18" fill="url(#accent)"/>
    <text x="928" y="195" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">FastAPI Control Plane</text>
    <text x="928" y="222" fill="#031018" font-size="14" font-family="Arial" text-anchor="middle">Auth, jobs, limits, billing</text>

    <rect x="190" y="374" width="185" height="90" rx="18" fill="url(#box)" stroke="#25476E"/>
    <text x="282" y="409" fill="white" font-size="18" font-family="Arial" text-anchor="middle" font-weight="800">PostgreSQL</text>
    <text x="282" y="436" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Users, jobs, files</text>

    <rect x="458" y="374" width="185" height="90" rx="18" fill="url(#box)" stroke="#25476E"/>
    <text x="550" y="409" fill="white" font-size="18" font-family="Arial" text-anchor="middle" font-weight="800">Redis Queue</text>
    <text x="550" y="436" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Pending work</text>

    <rect x="727" y="374" width="185" height="90" rx="18" fill="url(#box)" stroke="#25476E"/>
    <text x="819" y="409" fill="white" font-size="18" font-family="Arial" text-anchor="middle" font-weight="800">Scheduler</text>
    <text x="819" y="436" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Resource checks</text>

    <rect x="90" y="550" width="230" height="74" rx="18" fill="#0C223E" stroke="#25476E"/>
    <text x="205" y="583" fill="white" font-size="17" font-family="Arial" text-anchor="middle" font-weight="800">Local Proxmox Workers</text>
    <text x="205" y="608" fill="#A9B8D0" font-size="13" font-family="Arial" text-anchor="middle">ComfyUI / Ollama / agents</text>

    <rect x="435" y="550" width="230" height="74" rx="18" fill="#0C223E" stroke="#25476E"/>
    <text x="550" y="583" fill="white" font-size="17" font-family="Arial" text-anchor="middle" font-weight="800">Cloud GPU Overflow</text>
    <text x="550" y="608" fill="#A9B8D0" font-size="13" font-family="Arial" text-anchor="middle">Quote cost + margin</text>

    <rect x="780" y="550" width="230" height="74" rx="18" fill="#0C223E" stroke="#25476E"/>
    <text x="895" y="583" fill="white" font-size="17" font-family="Arial" text-anchor="middle" font-weight="800">SFTPGo Storage</text>
    <text x="895" y="608" fill="#A9B8D0" font-size="13" font-family="Arial" text-anchor="middle">Per-user files</text>
  </g>

  <path d="M236 205 H310" stroke="#72F7C3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M488 205 H562" stroke="#72F7C3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M740 205 H814" stroke="#72F7C3" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M900 250 C880 320 340 310 292 374" stroke="#72F7C3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M928 250 C920 320 565 310 550 374" stroke="#72F7C3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M958 250 C960 315 835 320 819 374" stroke="#72F7C3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <path d="M819 464 C760 528 312 505 205 550" stroke="#72F7C3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M819 464 C790 520 600 515 550 550" stroke="#72F7C3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M819 464 C840 520 880 515 895 550" stroke="#72F7C3" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
</svg>
