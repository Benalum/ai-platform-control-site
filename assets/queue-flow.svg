<svg width="1100" height="680" viewBox="0 0 1100 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="680" rx="28" fill="#07111F"/>
  <defs>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142D50"/>
      <stop offset="1" stop-color="#0A1C33"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72F7C3"/>
      <stop offset="1" stop-color="#70A7FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#72F7C3"/>
    </marker>
  </defs>

  <text x="52" y="68" fill="white" font-size="32" font-family="Arial" font-weight="800">Job Queue Flow</text>
  <text x="52" y="103" fill="#A9B8D0" font-size="18" font-family="Arial">A safe path from user request to verified result.</text>

  <g>
    <rect x="70" y="170" width="220" height="112" rx="22" fill="url(#step)" stroke="#25476E"/>
    <circle cx="105" cy="210" r="18" fill="url(#green)"/>
    <text x="105" y="217" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">1</text>
    <text x="180" y="207" fill="white" font-size="20" font-family="Arial" text-anchor="middle" font-weight="800">Submit Job</text>
    <text x="180" y="238" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Prompt, files, settings</text>

    <rect x="440" y="170" width="220" height="112" rx="22" fill="url(#step)" stroke="#25476E"/>
    <circle cx="475" cy="210" r="18" fill="url(#green)"/>
    <text x="475" y="217" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">2</text>
    <text x="550" y="207" fill="white" font-size="20" font-family="Arial" text-anchor="middle" font-weight="800">Validate</text>
    <text x="550" y="238" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Limits, safety, quota</text>

    <rect x="810" y="170" width="220" height="112" rx="22" fill="url(#step)" stroke="#25476E"/>
    <circle cx="845" cy="210" r="18" fill="url(#green)"/>
    <text x="845" y="217" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">3</text>
    <text x="920" y="207" fill="white" font-size="20" font-family="Arial" text-anchor="middle" font-weight="800">Queue</text>
    <text x="920" y="238" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Pending job record</text>

    <rect x="810" y="410" width="220" height="112" rx="22" fill="url(#step)" stroke="#25476E"/>
    <circle cx="845" cy="450" r="18" fill="url(#green)"/>
    <text x="845" y="457" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">4</text>
    <text x="920" y="447" fill="white" font-size="20" font-family="Arial" text-anchor="middle" font-weight="800">Schedule</text>
    <text x="920" y="478" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Find capable worker</text>

    <rect x="440" y="410" width="220" height="112" rx="22" fill="url(#step)" stroke="#25476E"/>
    <circle cx="475" cy="450" r="18" fill="url(#green)"/>
    <text x="475" y="457" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">5</text>
    <text x="550" y="447" fill="white" font-size="20" font-family="Arial" text-anchor="middle" font-weight="800">Run Job</text>
    <text x="550" y="478" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">ComfyUI / model task</text>

    <rect x="70" y="410" width="220" height="112" rx="22" fill="url(#step)" stroke="#25476E"/>
    <circle cx="105" cy="450" r="18" fill="url(#green)"/>
    <text x="105" y="457" fill="#031018" font-size="18" font-family="Arial" text-anchor="middle" font-weight="900">6</text>
    <text x="180" y="447" fill="white" font-size="20" font-family="Arial" text-anchor="middle" font-weight="800">Deliver</text>
    <text x="180" y="478" fill="#A9B8D0" font-size="14" font-family="Arial" text-anchor="middle">Save, verify, notify</text>
  </g>

  <path d="M290 226 H440" stroke="#72F7C3" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M660 226 H810" stroke="#72F7C3" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M920 282 V410" stroke="#72F7C3" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M810 466 H660" stroke="#72F7C3" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M440 466 H290" stroke="#72F7C3" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="230" y="585" width="640" height="42" rx="21" fill="rgba(114,247,195,0.10)" stroke="rgba(114,247,195,0.35)"/>
  <text x="550" y="611" fill="#D7FFF1" font-size="16" font-family="Arial" text-anchor="middle" font-weight="700">
    If no local worker fits, quote cloud compute cost before running.
  </text>
</svg>
